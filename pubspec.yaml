name: walkfit
description: Walk tracker, vegetarian food log and weight-loss planner.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.0.0
  flutter_map: ^8.2.0
  latlong2: ^0.9.1
  permission_handler: ">=12.0.0 <14.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-600.ttf
          weight: 600
        - asset: assets/fonts/InterDisplay-700.ttf
          weight: 700
        - asset: assets/fonts/InterDisplay-800.ttf
          weight: 800
